<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>时间计算器 - 距离目标时间还有多少小时</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Arial', sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
        }

        .container {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.15);
            width: 100%;
            max-width: 450px;
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 25px;
            font-size: 22px;
        }

        .input-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: 500;
        }

        input[type="datetime-local"] {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            outline: none;
            transition: border-color 0.3s;
        }

        input[type="datetime-local"]:focus {
            border-color: #667eea;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.3s;
            margin-bottom: 20px;
        }

        button:hover {
            background: #5a6edb;
        }

        .result {
            padding: 15px;
            border-radius: 8px;
            background: #f8f9fa;
            text-align: center;
            font-size: 18px;
            color: #333;
            min-height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .error {
            color: #dc3545;
        }

        .success {
            color: #28a745;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>时间计算器</h1>
        <div class="input-group">
            <label for="targetTime">请输入目标时间：</label>
            <input type="datetime-local" id="targetTime" required>
        </div>
        <button id="calculateBtn">计算剩余小时</button>
        <div id="result" class="result">请输入目标时间并点击计算按钮</div>
    </div>

    <script>
        // 获取DOM元素
        const targetTimeInput = document.getElementById('targetTime');
        const calculateBtn = document.getElementById('calculateBtn');
        const resultDiv = document.getElementById('result');

        // 格式化当前时间为datetime-local所需的格式（YYYY-MM-DDTHH:MM）
        function formatCurrentTime() {
            const now = new Date();
            // 补零操作：确保月份、日期、小时、分钟都是两位数
            const year = now.getFullYear();
            const month = String(now.getMonth() + 1).padStart(2, '0'); // 月份从0开始，需+1
            const day = String(now.getDate()).padStart(2, '0');
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            
            // 返回符合datetime-local格式的字符串
            return `${year}-${month}-${day}T${hours}:${minutes}`;
        }

        // 页面加载时，给输入框设置默认值为当前时间
        window.addEventListener('load', () => {
            targetTimeInput.value = formatCurrentTime();
        });

        // 计算小时差的核心函数
        function calculateHoursDifference() {
            // 获取输入的目标时间
            const targetTimeStr = targetTimeInput.value;
            if (!targetTimeStr) {
                resultDiv.textContent = '请先选择目标时间！';
                resultDiv.className = 'result error';
                return;
            }

            // 转换为时间戳（毫秒）
            const targetTime = new Date(targetTimeStr).getTime();
            const currentTime = new Date().getTime();

            // 检查目标时间是否小于当前时间
            if (targetTime < currentTime) {
                resultDiv.textContent = '目标时间不能早于当前时间！';
                resultDiv.className = 'result error';
                return;
            }

            // 计算时间差（毫秒），转换为小时（1小时=3600000毫秒）
            const timeDiff = targetTime - currentTime;
            const hoursDiff = (timeDiff / 3600000).toFixed(2); // 保留两位小数

            // 显示结果
            resultDiv.textContent = `距离目标时间还有 ${hoursDiff} 小时`;
            resultDiv.className = 'result success';
        }

        // 绑定按钮点击事件
        calculateBtn.addEventListener('click', calculateHoursDifference);

        // 可选：支持按回车键触发计算
        targetTimeInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                calculateHoursDifference();
            }
        });
    </script>
</body>
</html>
